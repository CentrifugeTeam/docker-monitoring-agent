[loggers]
keys=root,docker_agent

[handlers]
keys=file_handler,console_handler

[formatters]
keys=standard

[logger_root]
level=ERROR
handlers=console_handler

[logger_docker_agent]
level=INFO
handlers=file_handler,console_handler
qualname=docker_agent
propagate=0

[handler_file_handler]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=standard
args=('agent.log', 'a', 10485760, 3)  # 10MB, 3 backup files

[handler_console_handler]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
